<!DOCTYPE html><html><head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
</head><body>
<header class="proto-shell"><span class="logo">VIO</span><span class="proto-title">uplot_cdn.html · uPlot CDN 加载测试</span><a href="/" class="proto-back">← 返回平台</a></header>
<script>
const d = document.createElement('div'); document.body.appendChild(d);
new uPlot({width:480,height:200,series:[{},{stroke:'red'}]},
  [[0,1,2,3,4,5,6], [[0,1],[1,2],[2,4],[3,8],[4,16],[5,32],[6,64]]], d);
window._s=()=>{const c=d.querySelector('canvas');if(!c)return 'nocanvas';
const img=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
let red=0;for(let i=0;i<img.length;i+=4){if(img[i]>150&&img[i+1]<80&&img[i+2]<80)red++;}
return 'redpx='+red+' uplot='+(typeof uPlot);};
</script></body></html>
