<!DOCTYPE html><html><head>
<link rel="stylesheet" href="/vendor/uplot.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/uplot.iife.min.js"></script>
</head><body>
<header class="proto-shell"><span class="logo">VIO</span><span class="proto-title">uplot_bisect.html · uPlot bisect v1-v4</span><a href="/" class="proto-back">← 返回平台</a></header>
<script>
const t = Array.from({length:100},(_,i)=>1787217614+i*0.08);
const mk=(f)=>t.map((x,i)=>[x,Math.sin(i*0.2)*f]);
const data=[t,mk(1),mk(2),mk(3),mk(4),mk(5),mk(6)];
function mkdiv(id,label,opts){
  const d=document.createElement('div'); d.id=id; d.style.cssText='width:480px;height:240px;overflow:hidden';
  const h=document.createElement('h4'); h.textContent=label; d.appendChild(h);
  document.body.appendChild(d);
  new uPlot(opts, JSON.parse(JSON.stringify(data)), d);
}
// V1: player-exact options
mkdiv('v1','v1 player-exact', {title:'acc/gyro', width:480, height:200,
  scales:{x:{time:false}},
  series:[{},{label:'ax',stroke:'#ff8800'},{label:'ay',stroke:'#44eecc'},{label:'az',stroke:'#cc55ee'},
    {label:'gx',stroke:'#ff8800',dash:[4,4]},{label:'gy',stroke:'#44eecc',dash:[4,4]},{label:'gz',stroke:'#cc55ee',dash:[4,4]}]});
// V2: no dash
mkdiv('v2','v2 no-dash', {width:480, height:200, scales:{x:{time:false}},
  series:[{},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'}]});
// V3: no title, small-x
const t2 = Array.from({length:100},(_,i)=>i*0.1);
const data2=[t2, ...[1,2,3,4,5,6].map((f)=>t2.map((x,i)=>[x,Math.sin(i*0.2)*f]))];
window._v3 = new uPlot({width:480,height:200,scales:{x:{time:false}},
  series:[{},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'}]},
  data2, (()=>{const d=document.createElement('div');d.id='v3';document.body.appendChild(d);return d;})());
// V4: player-exact but setData after (like reuse path)
const v4d=document.createElement('div'); v4d.id='v4'; document.body.appendChild(v4d);
const up4=new uPlot({width:480,height:200,scales:{x:{time:false}},
  series:[{},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'},{stroke:'#ff8800'},{stroke:'#44eecc'},{stroke:'#cc55ee'}]},
  data2, v4d);
up4.setData(JSON.parse(JSON.stringify(data)));
window._scan=()=>['v1','v2','v3','v4'].map((id)=>{
  const c=document.getElementById(id).querySelector('canvas');
  if(!c) return id+':no-canvas';
  const img=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  let o=0,blk=0,tot=c.width*c.height;
  for(let i=0;i<img.length;i+=4){const r=img[i],g=img[i+1],b=img[i+2];
    if(r>200&&g>80&&g<170&&b<70)o++; if(r<40&&g<40&&b<40)blk++;}
  return id+': orange='+o+' black='+blk+'/'+tot;
});
</script></body></html>
